name: Gerar APK administrativo — Lanchonete 2

on:
  push:
    branches: [main]
    paths:
      - 'android-admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lanchonete-2-admin-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ADMIN_APP_TOKEN: ${{ secrets.ADMIN_APP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validar chave exclusiva do APK
        shell: bash
        run: |
          if [ -z "$ADMIN_APP_TOKEN" ]; then
            echo "::notice::Build ignorado: configure o secret ADMIN_APP_TOKEN para gerar o APK."
            exit 0
          fi
          if [ "${#ADMIN_APP_TOKEN}" -lt 32 ]; then
            echo "::error::O secret ADMIN_APP_TOKEN precisa ter pelo menos 32 caracteres."
            exit 1
          fi

      - name: Build APK
        if: env.ADMIN_APP_TOKEN != ''
        working-directory: android-admin-app
        run: gradle --no-daemon :app:assembleDebug -PadminAppToken="$ADMIN_APP_TOKEN"

      - name: Prepare APK
        if: env.ADMIN_APP_TOKEN != ''
        run: |
          mkdir -p apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-2-Admin-v1.2.apk
          cp android-admin-app/app/build/outputs/apk/debug/app-debug.apk apk/Lanchonete-2-Admin.apk

      - name: Upload artifact
        if: env.ADMIN_APP_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: Lanchonete-2-Admin-v1.2
          path: apk/Lanchonete-2-Admin-v1.2.apk

      - name: Save APK in repository
        if: env.ADMIN_APP_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Lanchonete-2-Admin.apk apk/Lanchonete-2-Admin-v1.2.apk
          if git diff --cached --quiet; then
            echo "APK sem alterações."
            exit 0
          fi
          git commit -m "Atualizar APK Lanchonete 2 v1.2 [skip ci]"
          git push
