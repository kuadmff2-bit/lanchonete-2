name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Wrangler globalmente
        run: npm install --global wrangler@4

      - name: Deploy no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler.jsonc
