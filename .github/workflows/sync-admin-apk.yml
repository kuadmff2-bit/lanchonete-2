name: Gravar APK final da Lanchonete 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-admin-apk.yml'

permissions:
  contents: write

concurrency:
  group: sync-lanchonete-2-admin-apk
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar e conferir APK final
        shell: bash
        run: |
          mkdir -p apk
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "https://raw.githubusercontent.com/kuadmff2-bit/Lanchonete-site-/main/apk/Lanchonete-2-Admin.apk" \
            --output apk/Lanchonete-2-Admin.apk
          cp apk/Lanchonete-2-Admin.apk apk/Lanchonete-2-Admin-v1.2.apk
          unzip -tq apk/Lanchonete-2-Admin.apk

      - name: Gravar arquivos no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Lanchonete-2-Admin.apk apk/Lanchonete-2-Admin-v1.2.apk
          if git diff --cached --quiet; then
            echo "APK já está atualizado."
            exit 0
          fi
          git commit -m "Adicionar APK administrador final v1.2 [skip ci]"
          git pull --rebase origin main
          git push
