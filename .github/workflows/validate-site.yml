name: Validar site simples

on:
  push:
    branches: [main]
    paths:
      - 'worker-simple.js'
      - 'worker.js'
      - 'storage.js'
      - 'durable-storage.js'
      - 'wrangler.jsonc'
      - 'script.js'
      - 'promo-order.js'
      - 'business-contact.js'
      - 'admin*.js'
      - 'promo-order-admin.js'
      - 'package.json'
      - '.github/workflows/validate-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir JavaScript
        run: npm run check
