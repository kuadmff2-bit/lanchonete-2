plugins {
    id 'com.android.application'
}

def adminAppToken = providers.gradleProperty("adminAppToken").getOrElse("")
def escapedAdminAppToken = adminAppToken
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace 'com.lanchonete.dois.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lanchonete.dois.admin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
        buildConfigField "String", "ADMIN_APP_TOKEN", "\"" + escapedAdminAppToken + "\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}
